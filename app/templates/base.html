<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Like for Like{% endblock %}</title>
  <style>
    :root {
      --ground: #f7f8f5;
      --surface: #fff;
      --ink: #17211d;
      --ink-soft: #4f5a54;
      --ink-faint: #7b857e;
      --rule: #dce1d9;
      --accent: #0b6b57;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, sans-serif;
    }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--rule); }
    .topbar .inner { max-width: 60rem; margin: 0 auto; padding: .85rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -.01em; }
    .back { font-size: .9rem; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .wrap { max-width: 60rem; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }
    h1 { font-size: 1.9rem; margin: 0 0 .4rem; }
    h2 { font-size: 1.3rem; margin: 0; }
    a { color: var(--accent); }
    .lede { color: var(--ink-soft); margin: 0 0 2rem; }
    fieldset { border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); padding: 1rem 1.25rem; margin: 0 0 1.5rem; }
    legend { font-weight: 600; padding: 0 .4rem; }
    .options { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: .35rem 1.5rem; }
    label { display: flex; align-items: center; gap: .5rem; padding: .15rem 0; }
    .chip { display: inline-block; vertical-align: -1px; width: .7rem; height: .7rem; border-radius: 2px; flex: none; margin-right: .15rem; }
    button { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 4px; padding: .6rem 1.4rem; cursor: pointer; }
    .area { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 1.5rem; margin: 0 0 1.5rem; }
    .area-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .75rem; margin-bottom: .25rem; }
    .year { font-size: .8rem; color: var(--ink-faint); }
    .question { color: var(--ink-soft); margin: 0 0 1.25rem; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: .5rem .6rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 12rem; }
    td.metric, th.metric-head { border-right: 1px solid var(--rule); }
    thead th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
    .metric { font-weight: 700; color: var(--accent); }
    .missing { color: var(--ink-faint); }
    .note { font-size: .82rem; color: var(--ink-faint); margin: 1rem 0 0; }
    svg { max-width: 100%; height: auto; }
    .figure { margin: 0 0 1.75rem; }
    .figure h3 { font-size: .95rem; margin: 0 0 .1rem; }
    .figure .sub { font-size: .85rem; color: var(--ink-faint); margin: 0 0 .75rem; }
    .chart-row { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start; }
    .chart-row svg { flex: 1 1 22rem; min-width: 0; }
    .legend { flex: 0 0 13rem; list-style: none; margin: 0; padding: 0; font-size: .85rem; }
    .legend li { display: grid; grid-template-columns: .7rem 1fr auto; gap: .5rem; align-items: baseline; padding: .3rem 0; border-bottom: 1px solid var(--rule); }
    .legend li:last-child { border-bottom: 0; }
    .legend .swatch { width: .7rem; height: .7rem; border-radius: 2px; align-self: center; }
    .legend .val { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }
    .legend .cap { font-weight: 600; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; font-size: .7rem; padding-bottom: .3rem; }
    .keys { display: flex; gap: 1.25rem; font-size: .82rem; color: var(--ink-soft); margin: .4rem 0 0; }
    .keys span { display: flex; align-items: center; gap: .4rem; }
    .keys .dot { width: .65rem; height: .65rem; border-radius: 50%; }
  </style>
</head>
<body>
  {% block nav %}{% endblock %}
  <div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
