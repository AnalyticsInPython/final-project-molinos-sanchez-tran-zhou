<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Like for Like{% endblock %}</title>
  <style>
    :root {
      --ground: #f7f8f5;
      --surface: #fff;
      --ink: #17211d;
      --ink-soft: #4f5a54;
      --ink-faint: #7b857e;
      --rule: #dce1d9;
      --accent: #0b6b57;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, sans-serif;
    }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--rule); }
    .topbar .inner { max-width: 60rem; margin: 0 auto; padding: .85rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -.01em; }
    .back { font-size: .9rem; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .wrap { max-width: 60rem; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }
    h1 { font-size: 1.9rem; margin: 0 0 .4rem; }
    h2 { font-size: 1.3rem; margin: 0; }
    a { color: var(--accent); }
    .lede { color: var(--ink-soft); margin: 0 0 2rem; }
    fieldset { border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); padding: 1rem 1.25rem; margin: 0 0 1.5rem; }
    legend { font-weight: 600; padding: 0 .4rem; }
    .options { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: .35rem 1.5rem; }
    label { display: flex; align-items: center; gap: .5rem; padding: .15rem 0; }
    .chip { display: inline-block; vertical-align: -1px; width: .7rem; height: .7rem; border-radius: 2px; flex: none; margin-right: .15rem; }
    button { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 4px; padding: .6rem 1.4rem; cursor: pointer; }
    button:disabled { background: var(--rule); color: var(--ink-faint); cursor: not-allowed; }
    .area { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 1.5rem; margin: 0 0 1.5rem; }
    .area-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .75rem; margin-bottom: .25rem; }
    .year { font-size: .8rem; color: var(--ink-faint); }
    .question { color: var(--ink-soft); margin: 0 0 1.25rem; }
    /* Data-quality notices. Stated above the charts, because a caveat read
       after the conclusion has already been drawn is not a caveat. */
    .notices { list-style: none; margin: 0 0 1.25rem; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
    .notice { display: flex; gap: .55rem; align-items: baseline; font-size: .88rem; line-height: 1.5; padding: .6rem .75rem; border-radius: 4px; border: 1px solid; }
    .notice-mark { flex: none; font-size: .95rem; line-height: 1.3; }
    .notice.warn { color: #6f4a05; background: #fdf6e6; border-color: #e6cf9a; }
    .notice.info { color: #33474f; background: #eef4f6; border-color: #c8d9de; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: .5rem .6rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 12rem; }
    td.metric, th.metric-head { border-right: 1px solid var(--rule); }
    thead th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
    .metric { font-weight: 700; color: var(--accent); }
    .missing { color: var(--ink-faint); }
    /* A cell that stacks a primary fact over a lighter secondary one, so
       related columns (city+setting, control+size) can merge into one
       without losing either value. */
    td.stack { white-space: normal; }
    td.stack .sub { display: block; font-size: .78rem; color: var(--ink-faint); margin-top: .1rem; }

    /* An attribute-rows / school-columns table: for areas that are mostly
       categorical facts rather than one comparable number, the default
       school-per-row table forces every fact about a school onto one line —
       right-aligned prose, mixed row heights. Flipped, each row compares one
       fact across every school, which is the shape the reading actually is. */
    table.compare th, table.compare td { text-align: left; white-space: normal; vertical-align: top; }
    table.compare thead th { text-transform: none; letter-spacing: normal; font-size: .92rem; font-weight: 600; color: var(--ink); padding-bottom: .65rem; }
    table.compare tbody th { font-weight: 600; font-size: .82rem; color: var(--ink-soft); padding-right: 1.1rem; min-width: 9rem; }
    table.compare tbody tr:nth-child(odd) { background: var(--ground); }
    table.compare td.metric { font-weight: 700; color: var(--accent); }
    .note { font-size: .82rem; color: var(--ink-faint); margin: 1rem 0 0; }
    svg { max-width: 100%; height: auto; }
    .figure { margin: 0 0 1.75rem; }
    .figure h3 { font-size: .95rem; margin: 0 0 .1rem; }
    .figure .sub { font-size: .85rem; color: var(--ink-faint); margin: 0 0 .75rem; }
    .chart-row { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start; }
    .chart-row svg { flex: 1 1 22rem; min-width: 0; }
    .legend { flex: 0 0 13rem; list-style: none; margin: 0; padding: 0; font-size: .85rem; }
    .legend li { display: grid; grid-template-columns: .7rem 1fr auto; gap: .5rem; align-items: baseline; padding: .3rem 0; border-bottom: 1px solid var(--rule); }
    .legend li:last-child { border-bottom: 0; }
    .legend .swatch { width: .7rem; height: .7rem; border-radius: 2px; align-self: center; }
    .legend .val { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }
    .legend .cap { font-weight: 600; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; font-size: .7rem; padding-bottom: .3rem; }
    .keys { display: flex; gap: 1.25rem; font-size: .82rem; color: var(--ink-soft); margin: .4rem 0 0; }
    .keys span { display: flex; align-items: center; gap: .4rem; }
    .keys .dot { width: .65rem; height: .65rem; border-radius: 50%; }

    /* --- Picker: two columns, a searchable school combobox, an area menu --- */
    .picker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; margin: 0 0 1.75rem; }
    @media (max-width: 46rem) { .picker-grid { grid-template-columns: 1fr; } }
    .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 1.1rem 1.25rem 1.25rem; }
    .panel-title { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 700; margin: 0 0 .3rem; }
    .panel-hint { font-size: .85rem; color: var(--ink-soft); margin: 0 0 .9rem; }
    .field { width: 100%; font: inherit; color: var(--ink); background: var(--ground); border: 1px solid var(--rule); border-radius: 4px; padding: .55rem .7rem; }
    .field:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
    .field:disabled { color: var(--ink-faint); cursor: not-allowed; }
    .menu { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: .3rem; list-style: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.10); }
    .combo { position: relative; }
    .combo .menu { max-height: 15rem; overflow-y: auto; }
    .combo .menu li { display: flex; align-items: center; gap: .55rem; padding: .45rem .55rem; border-radius: 3px; cursor: pointer; font-size: .92rem; }
    .combo .menu li[aria-selected="true"] { background: var(--ground); }
    .combo .menu li.empty { color: var(--ink-faint); cursor: default; }
    .chips { list-style: none; margin: .9rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
    .chips li { display: flex; align-items: center; gap: .6rem; padding: .45rem .55rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--ground); }
    .chips .name { flex: 1; min-width: 0; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chips li.clash { border-color: #c08a1e; background: #fdf7ea; }
    .drop { background: none; border: 0; color: var(--ink-faint); font-size: 1.15rem; font-weight: 400; line-height: 1; padding: .1rem .35rem; border-radius: 3px; cursor: pointer; }
    .drop:hover { background: var(--rule); color: var(--ink); }
    /* A real colour input: the OS picker is better than anything we would build. */
    .swatch { -webkit-appearance: none; appearance: none; flex: none; width: 1.6rem; height: 1.6rem; padding: 0; background: none; border: 1px solid var(--rule); border-radius: 3px; cursor: pointer; }
    .swatch::-webkit-color-swatch-wrapper { padding: 2px; }
    .swatch::-webkit-color-swatch { border: 0; border-radius: 2px; }
    .swatch::-moz-color-swatch { border: 0; border-radius: 2px; }
    .hint { font-size: .82rem; color: var(--ink-faint); margin: .6rem 0 0; }
    .hint.warn { color: #8a5f10; }
    .years-panel { margin: 0 0 1.75rem; }
    .spans { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 1rem; }
    .span { font-size: .85rem; font-weight: 500; padding: .4rem .8rem; background: var(--ground); color: var(--ink); border: 1px solid var(--rule); }
    .span:hover { background: var(--surface); border-color: var(--rule-strong, #c3ccd6); }
    .span.clear { color: var(--ink-faint); }
    /* A year's colour is its data coverage: green where every selected school
       can be drawn, amber where some cannot, grey where none can. Colour is
       never the only carrier — each chip also has a title naming the schools. */
    .years { list-style: none; display: flex; flex-wrap: wrap; gap: .35rem; margin: 0; padding: 0; }
    .year { font-variant-numeric: tabular-nums; font-size: .85rem; font-weight: 500; padding: .35rem .6rem; border-radius: 4px; border: 1px solid; cursor: pointer; }
    .year.ok { background: #e8f3ec; border-color: #a8ceb8; color: #1c5f39; }
    .year.part { background: #fdf3e0; border-color: #e0c48b; color: #7a5410; }
    .year.none { background: var(--ground); border-color: var(--rule); color: var(--ink-faint); cursor: not-allowed; }
    .year.ok:hover, .year.part:hover { filter: brightness(.97); }
    .year.on { box-shadow: inset 0 0 0 2px currentColor; font-weight: 700; }
    .years-key { margin-top: .75rem; }
    .years-key .dot.ok { background: #4d9c72; }
    .years-key .dot.part { background: #d9a94b; }
    .years-key .dot.none { background: #c3ccd6; }
    .dropdown { position: relative; }
    .dropdown-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: .5rem; text-align: left; font-weight: 500; color: var(--ink); background: var(--ground); border: 1px solid var(--rule); padding: .55rem .7rem; }
    .dropdown-toggle:hover { background: var(--surface); }
    .dropdown-toggle .caret { color: var(--ink-faint); font-size: .65rem; }
    .dropdown .menu label { display: flex; align-items: center; gap: .55rem; padding: .45rem .55rem; border-radius: 3px; cursor: pointer; font-size: .92rem; }
    .dropdown .menu label:hover { background: var(--ground); }
    /* Icons are stroked in the inherited colour so an area reads the same in
       the menu, on its summary line and on its heading. */
    .icon { flex: none; width: 1.15rem; height: 1.15rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .area-head .icon { align-self: center; color: var(--accent); }
    .summary-areas { display: flex; align-items: center; gap: .45rem; min-width: 0; }
    .summary-areas .icon { color: var(--accent); }
  </style>
</head>
<body>
  {% block nav %}{% endblock %}
  <div class="wrap">{% block content %}{% endblock %}</div>
  {% block scripts %}{% endblock %}
</body>
</html>
