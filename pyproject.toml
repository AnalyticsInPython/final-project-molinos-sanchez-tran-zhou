[project]
name = "like-for-like"
version = "0.1.0"
description = "College comparison on net price at your income and outcomes against a peer group"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "polars>=1.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
